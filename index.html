<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>レッスンメモ</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #22252a;
    --muted: #8a8f98;
    --line: #e6e4de;
    --accent: #2f8f7a;
    --done: #b3b7bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --card: #202328;
      --text: #e9eaec;
      --muted: #8d939c;
      --line: #2e3238;
      --accent: #5cc4aa;
      --done: #5b6068;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .month {
    flex: 1; text-align: center;
    font-size: 18px; font-weight: 700;
    background: none; border: 0; color: var(--text); padding: 8px 0;
  }
  .nav {
    width: 40px; height: 40px; border-radius: 20px;
    border: 0; background: none; color: var(--text); font-size: 22px;
  }
  .copy-all {
    border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 18px; padding: 7px 12px; font-size: 14px; font-weight: 600;
  }
  button { cursor: pointer; font-family: inherit; }
  main {
    max-width: 720px; margin: 0 auto;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 50vh);
  }
  .day {
    display: flex; align-items: center; justify-content: space-between;
    margin: 18px 0 4px; color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .day button {
    border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 6px;
  }
  .item { display: flex; align-items: flex-start; gap: 8px; }
  .bullet {
    flex: none; width: 28px; height: 34px; border: 0; background: none;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .bullet::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text);
  }
  .item.done .bullet::before {
    content: "✓"; width: auto; height: auto; background: none;
    color: var(--accent); font-size: 16px; font-weight: 700;
  }
  textarea {
    flex: 1; resize: none; overflow: hidden;
    border: 0; outline: none; background: none; color: var(--text);
    font: inherit; font-size: 17px; line-height: 1.5;
    padding: 5px 0; min-height: 34px;
  }
  .item.done textarea { color: var(--done); text-decoration: line-through; }
  textarea::placeholder { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; line-height: 1.7; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 20px; font-size: 14px;
    transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header>
  <button class="nav" id="prev" aria-label="前の月">‹</button>
  <button class="month" id="month" title="今月へ"></button>
  <button class="nav" id="next" aria-label="次の月">›</button>
  <button class="copy-all" id="copyAll">コピー</button>
</header>
<main id="list"></main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'lessonMemo.v1';
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = (id) => document.getElementById(id);
  const listEl = $('list');

  // data: { "YYYY-MM": [{ id, text, done, t }] }
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }

  const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const thisMonth = () => monthKey(new Date());
  let current = thisMonth();

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };
  const dayLabel = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`; };

  // 過去・未来の月で新規メモを書いたときは、その月の1日（今月なら今）を日付にする
  const newTime = () => {
    if (current === thisMonth()) return Date.now();
    const [y, m] = current.split('-').map(Number);
    return new Date(y, m - 1, 1, 12).getTime();
  };

  const items = () => (data[current] ||= []);

  // いつでもすぐ書けるよう、最後は空行にしておく
  function ensureTail() {
    const arr = items();
    if (!arr.length || arr[arr.length - 1].text !== '') {
      arr.push({ id: uid(), text: '', done: false, t: newTime() });
    }
    return arr;
  }

  let saveTimer;
  const save = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const out = {};
      for (const [k, arr] of Object.entries(data)) {
        const kept = arr.filter((it) => it.text.trim() !== '');
        if (kept.length) out[k] = kept;
      }
      try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
    }, 200);
  };
  window.addEventListener('pagehide', () => { clearTimeout(saveTimer); saveTimer = null; save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  const autosize = (ta) => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };

  function render(focusId, caret) {
    const [y, m] = current.split('-').map(Number);
    $('month').textContent = `${y}年${m}月`;

    const arr = ensureTail();

    listEl.textContent = '';
    let lastDay = null;
    arr.forEach((it, i) => {
      const dk = dayKey(it.t);
      if (dk !== lastDay) {
        lastDay = dk;
        const head = document.createElement('div');
        head.className = 'day';
        head.innerHTML = `<span>${dayLabel(it.t)}</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'この日をコピー';
        btn.onclick = () => copy(textFor(arr.filter((x) => dayKey(x.t) === dk)), `${dayLabel(it.t)}をコピーしました`);
        head.appendChild(btn);
        listEl.appendChild(head);
      }

      const row = document.createElement('div');
      row.className = 'item' + (it.done ? ' done' : '');
      const bullet = document.createElement('button');
      bullet.className = 'bullet';
      bullet.setAttribute('aria-label', '完了の切り替え');
      bullet.tabIndex = -1;
      // タップしても入力中の行からフォーカス（キーボード）を奪わない
      bullet.addEventListener('mousedown', (e) => e.preventDefault());
      bullet.onclick = () => {
        if (it.text === '') return;
        it.done = !it.done;
        row.classList.toggle('done', it.done);
        save();
      };
      const ta = document.createElement('textarea');
      ta.rows = 1;
      ta.value = it.text;
      ta.dataset.id = it.id;
      ta.enterKeyHint = 'next';
      if (i === arr.length - 1) ta.placeholder = 'メモを入力…';
      ta.addEventListener('input', () => {
        // 改行が貼り付けられた場合は複数の項目に分ける
        if (ta.value.includes('\n')) {
          const parts = ta.value.split(/\r?\n/);
          it.text = parts.shift();
          const idx = arr.indexOf(it);
          const added = parts.map((p) => ({ id: uid(), text: p, done: false, t: it.t }));
          arr.splice(idx + 1, 0, ...added);
          save();
          const last = added[added.length - 1];
          render(last.id, last.text.length);
          return;
        }
        // 開きっぱなしで日付が変わった空行に書き始めたら、今日の日付にする
        if (it.text === '' && current === thisMonth() && dayKey(it.t) !== dayKey(Date.now())) {
          it.t = Date.now();
          it.text = ta.value;
          save();
          render(it.id);
          return;
        }
        it.text = ta.value;
        autosize(ta);
        save();
      });
      ta.addEventListener('keydown', (e) => onKey(e, ta, it));
      row.append(bullet, ta);
      listEl.appendChild(row);
    });

    listEl.querySelectorAll('textarea').forEach(autosize);
    if (focusId) {
      // すぐ打ち続けても文字が消えないよう、同期的にフォーカスする
      const ta = listEl.querySelector(`textarea[data-id="${focusId}"]`);
      if (ta) {
        ta.focus({ preventScroll: true });
        const pos = caret == null ? ta.value.length : caret;
        ta.setSelectionRange(pos, pos);
        const r = ta.getBoundingClientRect();
        if (r.bottom > window.innerHeight * 0.6 || r.top < 70) {
          ta.scrollIntoView({ block: 'center' });
        }
      }
    }
  }

  function onKey(e, ta, it) {
    // 日本語変換の確定エンターは無視
    if (e.isComposing || e.keyCode === 229) return;
    const arr = items();
    const idx = arr.indexOf(it);

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const pos = ta.selectionStart;
      const after = it.text.slice(ta.selectionEnd);
      it.text = it.text.slice(0, pos);
      const isLast = idx === arr.length - 1;
      // 末尾に追加するなら今の時刻、途中に挿入するなら前の項目と同じ日付
      const t = isLast && current === thisMonth() ? Date.now() : it.t;
      const next = { id: uid(), text: after, done: false, t };
      arr.splice(idx + 1, 0, next);
      save();
      render(next.id, 0);
      return;
    }

    if (e.key === 'Backspace' && ta.selectionStart === 0 && ta.selectionEnd === 0 && idx > 0) {
      // 行頭でバックスペース → 前の項目とつなげる
      e.preventDefault();
      const prev = arr[idx - 1];
      const caret = prev.text.length;
      prev.text += it.text;
      arr.splice(idx, 1);
      save();
      render(prev.id, caret);
      return;
    }

    if (e.key === 'ArrowUp' && ta.selectionStart === 0 && idx > 0) {
      e.preventDefault();
      render(arr[idx - 1].id);
    } else if (e.key === 'ArrowDown' && ta.selectionEnd === ta.value.length && idx < arr.length - 1) {
      e.preventDefault();
      render(arr[idx + 1].id);
    }
  }

  function textFor(arr) {
    return arr.filter((it) => it.text.trim() !== '')
      .map((it) => (it.done ? '✓ ' : '・') + it.text)
      .join('\n');
  }

  function monthText() {
    const [y, m] = current.split('-').map(Number);
    const lines = [`${y}年${m}月`];
    let lastDay = null;
    for (const it of items()) {
      if (it.text.trim() === '') continue;
      const dk = dayKey(it.t);
      if (dk !== lastDay) { lastDay = dk; lines.push('', `■ ${dayLabel(it.t)}`); }
      lines.push((it.done ? '✓ ' : '・') + it.text);
    }
    return lines.length > 1 ? lines.join('\n') : '';
  }

  async function copy(text, msg) {
    if (!text) { toast('コピーするメモがありません'); return; }
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.style.position = 'fixed'; tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); } catch (err) {}
      tmp.remove();
    }
    toast(msg);
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function shiftMonth(delta) {
    const [y, m] = current.split('-').map(Number);
    current = monthKey(new Date(y, m - 1 + delta, 1));
    render();
    window.scrollTo(0, 0);
  }

  $('prev').onclick = () => shiftMonth(-1);
  $('next').onclick = () => shiftMonth(1);
  $('month').onclick = () => { current = thisMonth(); openAtEnd(); };
  $('copyAll').onclick = () => {
    const [, m] = current.split('-').map(Number);
    copy(monthText(), `${m}月のメモをコピーしました`);
  };

  // 開いたら今月の一番下の入力行にカーソル
  function openAtEnd() {
    const arr = ensureTail();
    render(arr[arr.length - 1].id);
  }
  openAtEnd();
})();
</script>
</body>
</html>
