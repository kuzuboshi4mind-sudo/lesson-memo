<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レッスンメモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>レッスンメモ</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --text: #22252a;
    --muted: #8a8f98;
    --line: #e6e4de;
    --accent: #2f8f7a;
    --done: #b3b7bd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c;
      --card: #202328;
      --text: #e9eaec;
      --muted: #8d939c;
      --line: #2e3238;
      --accent: #5cc4aa;
      --done: #5b6068;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    min-height: 100vh;
  }
  .top {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  header {
    padding: 8px 12px 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .in-folder .nav { visibility: hidden; }
  .month { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 10px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 16px; padding: 6px 12px; font-size: 14px; white-space: nowrap;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tab.plus { color: var(--accent); font-weight: 700; padding: 6px 14px; }
  .month-head { margin: 24px 0 0; font-size: 15px; font-weight: 700; }
  .month {
    flex: 1; text-align: center;
    font-size: 18px; font-weight: 700;
    background: none; border: 0; color: var(--text); padding: 8px 0;
  }
  .nav {
    width: 40px; height: 40px; border-radius: 20px;
    border: 0; background: none; color: var(--text); font-size: 22px;
  }
  .copy-all {
    border: 1px solid var(--accent); color: var(--accent); background: none;
    border-radius: 18px; padding: 7px 12px; font-size: 14px; font-weight: 600;
  }
  button { cursor: pointer; font-family: inherit; }
  main {
    max-width: 720px; margin: 0 auto;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 50vh);
  }
  .day {
    display: flex; align-items: center; justify-content: space-between;
    margin: 18px 0 4px; color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .day button {
    border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 6px;
  }
  .item { display: flex; align-items: flex-start; gap: 8px; }
  .item .body { flex: 1; min-width: 0; }
  .item textarea { width: 100%; display: block; }
  .tag {
    border: 0; background: none; color: var(--accent); font-size: 12px;
    padding: 0 0 6px; margin-top: -2px;
  }
  .fbtn {
    flex: none; width: 34px; height: 34px; border: 0; background: none; font-size: 17px;
    visibility: hidden; padding: 0;
  }
  .item:focus-within .fbtn { visibility: visible; }
  .bullet {
    flex: none; width: 28px; height: 34px; border: 0; background: none;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .bullet::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text);
  }
  .item.done .bullet::before {
    content: "✓"; width: auto; height: auto; background: none;
    color: var(--accent); font-size: 16px; font-weight: 700;
  }
  textarea {
    flex: 1; resize: none; overflow: hidden;
    border: 0; outline: none; background: none; color: var(--text);
    font: inherit; font-size: 17px; line-height: 1.5;
    padding: 5px 0; min-height: 34px;
  }
  .item.done textarea { color: var(--done); text-decoration: line-through; }
  textarea::placeholder { color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; line-height: 1.7; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 20px; font-size: 14px;
    transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .cloud {
    position: relative; width: 40px; height: 40px; border-radius: 20px;
    border: 0; background: none; color: var(--muted); font-size: 20px;
  }
  .cloud .dot {
    position: absolute; right: 6px; top: 8px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .cloud.ok .dot { background: var(--accent); }
  .cloud.busy .dot { background: #e0a030; }
  .cloud.off .dot { background: #d05050; }
  [hidden] { display: none !important; }
  .sheet-bg {
    position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, .35);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 480px; background: var(--card); color: var(--text);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .sheet h2 { font-size: 17px; margin: 0 0 8px; }
  .sheet .note { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 12px; word-break: break-all; }
  .sheet input {
    display: block; width: 100%; margin: 0 0 10px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
  }
  .sheet .row { display: flex; gap: 8px; }
  .sheet button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .sheet button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sheet button.link { display: block; border: 0; background: none; color: var(--accent); margin-top: 8px; padding: 8px; width: 100%; }
  .sheet button.close { color: var(--muted); }
  .sheet button:disabled { opacity: .5; }
  .sheet .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .sheet .choices button { text-align: left; font-weight: 500; }
  .sheet .choices button.chosen { border-color: var(--accent); color: var(--accent); }
  #modalBody > button { display: block; width: 100%; margin-bottom: 8px; }
  .sheet button.danger { color: #d05050; background: none; border-color: transparent; font-weight: 500; }
  .sheet .err { color: #d05050; font-size: 13px; min-height: 1em; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="top">
<header>
  <button class="nav" id="prev" aria-label="前の月">‹</button>
  <button class="month" id="month" title="今月へ"></button>
  <button class="nav" id="next" aria-label="次の月">›</button>
  <button class="cloud" id="cloud" aria-label="同期" hidden><span class="dot" id="cloudDot"></span>☁</button>
  <button class="copy-all" id="copyAll">コピー</button>
</header>
<nav class="tabs" id="tabs"></nav>
</div>
<main id="list"></main>
<div class="toast" id="toast"></div>

<div class="sheet-bg" id="modal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <button class="link close" id="modalClose">閉じる</button>
  </div>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">同期（iPhone・iPad）</h2>
    <div id="signedOut">
      <p class="note">同じメールアドレスとパスワードでログインすると、端末どうしでメモが同期されます。</p>
      <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" autocapitalize="off">
      <input id="password" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password">
      <p class="err" id="authErr"></p>
      <div class="row">
        <button class="primary" id="signIn">ログイン</button>
        <button id="signUp">はじめて使う（登録）</button>
      </div>
      <button class="link" id="reset">パスワードを忘れた</button>
    </div>
    <div id="signedIn" hidden>
      <p class="note"><span id="who"></span> でログイン中</p>
      <p class="note">状態：<span id="syncState"></span></p>
      <button id="signOut">ログアウト</button>
    </div>
    <button class="link close" id="closeSheet">閉じる</button>
  </div>
</div>

<script>
(() => {
  const KEY = 'lessonMemo.v1';
  const FOLDERS_KEY = 'lessonMemo.folders';
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = (id) => document.getElementById(id);
  const listEl = $('list');

  // data: { "YYYY-MM": [{ id, text, done, t, f? }] }  f はフォルダの id
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  // folders: [{ id, name, pos }]
  let folders = [];
  try { folders = JSON.parse(localStorage.getItem(FOLDERS_KEY)) || []; } catch (e) { folders = []; }

  const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const thisMonth = () => monthKey(new Date());
  let current = thisMonth();
  let folder = null; // 開いているフォルダの id（null なら「すべて」＝月ごとの表示）

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate(); };
  const dayLabel = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}(${WEEK[d.getDay()]})`; };
  const monthLabel = (k) => { const [y, m] = k.split('-').map(Number); return `${y}年${m}月`; };
  const sortedFolders = () => [...folders].sort((a, b) => a.pos - b.pos);
  const folderOf = (id) => folders.find((f) => f.id === id);

  // 過去・未来の月で新規メモを書いたときは、その月の1日（今月なら今）を日付にする
  const newTime = () => {
    if (folder || current === thisMonth()) return Date.now();
    const [y, m] = current.split('-').map(Number);
    return new Date(y, m - 1, 1, 12).getTime();
  };
  const month = (k) => (data[k] ||= []);
  const cleanMonth = (arr) => (arr || []).filter((it) => it.text.trim() !== '');

  // 画面に並べる項目：{ it, k }（k はその項目が入っている月）
  function buildView(keepId) {
    // 入力中の行以外の空行は片づける
    for (const k of Object.keys(data)) {
      data[k] = data[k].filter((it) => it.text !== '' || it.id === keepId);
    }
    let view;
    if (folder) {
      view = [];
      for (const k of Object.keys(data).sort()) {
        for (const it of data[k]) if (it.f === folder) view.push({ it, k });
      }
    } else {
      view = month(current).map((it) => ({ it, k: current }));
    }
    // いつでもすぐ書けるよう、最後は空行にしておく
    if (!view.length || view[view.length - 1].it.text !== '') {
      const k = folder ? thisMonth() : current;
      const it = { id: uid(), text: '', done: false, t: newTime() };
      if (folder) it.f = folder;
      month(k).push(it);
      view.push({ it, k });
    }
    return view;
  }

  let saveTimer = null;
  function persistLocal() {
    clearTimeout(saveTimer);
    saveTimer = null;
    const out = {};
    for (const [k, arr] of Object.entries(data)) {
      const kept = cleanMonth(arr);
      if (kept.length) out[k] = kept;
    }
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
  }
  const save = (...ks) => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistLocal, 200);
    for (const k of new Set(ks)) window.memoApp.onChange?.(k);
  };
  const flushLocal = () => { if (saveTimer) persistLocal(); };
  window.addEventListener('pagehide', flushLocal);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushLocal(); });

  function saveFolders() {
    try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders)); } catch (e) {}
    window.memoApp.onFoldersChange?.();
  }

  const autosize = (ta) => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  let view = [];

  function renderTabs() {
    const tabs = $('tabs');
    tabs.textContent = '';
    const add = (label, active, onclick, cls = '') => {
      const b = document.createElement('button');
      b.className = 'tab' + (active ? ' active' : '') + cls;
      b.textContent = label;
      b.onclick = onclick;
      tabs.appendChild(b);
      return b;
    };
    add('すべて', !folder, () => { if (folder) { folder = null; openAtEnd(); } });
    for (const f of sortedFolders()) {
      const b = add('📁 ' + f.name, folder === f.id, () => {
        if (folder === f.id) editFolder(f);
        else { folder = f.id; openAtEnd(); }
      });
      if (folder === f.id) requestAnimationFrame(() => b.scrollIntoView({ inline: 'nearest', block: 'nearest' }));
    }
    add('＋', false, () => newFolder(), ' plus').setAttribute('aria-label', 'フォルダを追加');
  }

  function render(focusId, caret) {
    const f = folder && folderOf(folder);
    if (folder && !f) folder = null;
    document.body.classList.toggle('in-folder', !!folder);
    $('month').textContent = folder ? '📁 ' + f.name : monthLabel(current);
    renderTabs();

    view = buildView(focusId);
    listEl.textContent = '';
    let lastDay = null;
    let lastMonth = null;
    view.forEach((v, i) => {
      const { it } = v;
      if (folder && v.k !== lastMonth) {
        lastMonth = v.k;
        lastDay = null;
        const mh = document.createElement('div');
        mh.className = 'month-head';
        mh.textContent = monthLabel(v.k);
        listEl.appendChild(mh);
      }
      const dk = dayKey(it.t);
      if (dk !== lastDay) {
        lastDay = dk;
        const head = document.createElement('div');
        head.className = 'day';
        head.innerHTML = `<span>${dayLabel(it.t)}</span>`;
        const btn = document.createElement('button');
        btn.textContent = 'この日をコピー';
        btn.onclick = () => copy(textFor(view.filter((x) => dayKey(x.it.t) === dk).map((x) => x.it)), `${dayLabel(it.t)}をコピーしました`);
        head.appendChild(btn);
        listEl.appendChild(head);
      }

      const row = document.createElement('div');
      row.className = 'item' + (it.done ? ' done' : '');
      const bullet = document.createElement('button');
      bullet.className = 'bullet';
      bullet.setAttribute('aria-label', '完了の切り替え');
      bullet.tabIndex = -1;
      // タップしても入力中の行からフォーカス（キーボード）を奪わない
      bullet.addEventListener('mousedown', (e) => e.preventDefault());
      bullet.onclick = () => {
        if (it.text === '') return;
        it.done = !it.done;
        row.classList.toggle('done', it.done);
        save(v.k);
      };

      const body = document.createElement('div');
      body.className = 'body';
      const ta = document.createElement('textarea');
      ta.rows = 1;
      ta.value = it.text;
      ta.dataset.id = it.id;
      ta.enterKeyHint = 'next';
      if (i === view.length - 1) ta.placeholder = folder ? `「${f.name}」にメモを入力…` : 'メモを入力…';
      ta.addEventListener('input', () => {
        // 改行が貼り付けられた場合は複数の項目に分ける
        if (ta.value.includes('\n')) {
          const parts = ta.value.split(/\r?\n/);
          it.text = parts.shift();
          const arr = month(v.k);
          const added = parts.map((p) => withFolder({ id: uid(), text: p, done: false, t: it.t }, it.f));
          arr.splice(arr.indexOf(it) + 1, 0, ...added);
          save(v.k);
          const last = added[added.length - 1];
          render(last.id, last.text.length);
          return;
        }
        // 開きっぱなしで日付が変わった空行に書き始めたら、今日の日付にする
        if (it.text === '' && v.k === thisMonth() && dayKey(it.t) !== dayKey(Date.now())) {
          it.t = Date.now();
          it.text = ta.value;
          save(v.k);
          render(it.id);
          return;
        }
        it.text = ta.value;
        autosize(ta);
        save(v.k);
      });
      ta.addEventListener('keydown', (e) => onKey(e, ta, i));
      body.appendChild(ta);

      // 「すべて」では、フォルダに入っているメモにフォルダ名を表示
      const fo = !folder && it.f && folderOf(it.f);
      if (fo) {
        const tag = document.createElement('button');
        tag.className = 'tag';
        tag.textContent = '📁 ' + fo.name;
        tag.onclick = () => pickFolder(v);
        body.appendChild(tag);
      }

      const fbtn = document.createElement('button');
      fbtn.className = 'fbtn';
      fbtn.textContent = '📁';
      fbtn.setAttribute('aria-label', 'フォルダに入れる');
      fbtn.tabIndex = -1;
      fbtn.addEventListener('mousedown', (e) => e.preventDefault());
      fbtn.onclick = () => pickFolder(v);

      row.append(bullet, body, fbtn);
      listEl.appendChild(row);
    });

    listEl.querySelectorAll('textarea').forEach(autosize);
    if (focusId) {
      // すぐ打ち続けても文字が消えないよう、同期的にフォーカスする
      const ta = listEl.querySelector(`textarea[data-id="${focusId}"]`);
      if (ta) {
        ta.focus({ preventScroll: true });
        const pos = caret == null ? ta.value.length : caret;
        ta.setSelectionRange(pos, pos);
        const r = ta.getBoundingClientRect();
        if (r.bottom > window.innerHeight * 0.6 || r.top < 120) {
          ta.scrollIntoView({ block: 'center' });
        }
      }
    }
  }

  const withFolder = (it, f) => { if (f) it.f = f; return it; };

  function onKey(e, ta, i) {
    // 日本語変換の確定エンターは無視
    if (e.isComposing || e.keyCode === 229) return;
    const { it, k } = view[i];

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const pos = ta.selectionStart;
      const after = it.text.slice(ta.selectionEnd);
      it.text = it.text.slice(0, pos);
      const isLast = i === view.length - 1;
      // 末尾に追加するなら今の時刻、途中に挿入するなら前の項目と同じ日付
      const t = isLast && k === thisMonth() ? Date.now() : it.t;
      const next = withFolder({ id: uid(), text: after, done: false, t }, folder);
      const arr = month(k);
      arr.splice(arr.indexOf(it) + 1, 0, next);
      save(k);
      render(next.id, 0);
      return;
    }

    if (e.key === 'Backspace' && ta.selectionStart === 0 && ta.selectionEnd === 0 && i > 0) {
      // 行頭でバックスペース → 前の項目とつなげる
      e.preventDefault();
      const prev = view[i - 1];
      const caret = prev.it.text.length;
      prev.it.text += it.text;
      const arr = month(k);
      arr.splice(arr.indexOf(it), 1);
      save(k, prev.k);
      render(prev.it.id, caret);
      return;
    }

    if (e.key === 'ArrowUp' && ta.selectionStart === 0 && i > 0) {
      e.preventDefault();
      render(view[i - 1].it.id);
    } else if (e.key === 'ArrowDown' && ta.selectionEnd === ta.value.length && i < view.length - 1) {
      e.preventDefault();
      render(view[i + 1].it.id);
    }
  }

  // ---- フォルダ ----
  const modal = $('modal');
  function openModal(title, build) {
    $('modalTitle').textContent = title;
    const body = $('modalBody');
    body.textContent = '';
    build(body);
    modal.hidden = false;
  }
  let pendingRender = false; // ダイアログ中に他の端末から変更が届いたら、閉じたときに描き直す
  const closeModal = () => {
    modal.hidden = true;
    if (pendingRender) { pendingRender = false; render(); }
  };
  $('modalClose').onclick = closeModal;
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };

  function nameForm(body, value, okLabel, onOk) {
    const input = document.createElement('input');
    input.placeholder = 'フォルダ名（例：生徒の名前）';
    input.value = value;
    const ok = document.createElement('button');
    ok.className = 'primary';
    ok.textContent = okLabel;
    const submit = () => {
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      onOk(name);
    };
    ok.onclick = submit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); }
    });
    body.append(input, ok);
    requestAnimationFrame(() => input.focus());
  }

  function createFolder(name) {
    const last = sortedFolders().pop();
    const f = { id: uid(), name, pos: last ? last.pos + 1 : 0 };
    folders.push(f);
    saveFolders();
    return f;
  }

  function newFolder() {
    openModal('新しいフォルダ', (body) => nameForm(body, '', '作成', (name) => {
      const f = createFolder(name);
      closeModal();
      folder = f.id;
      openAtEnd();
    }));
  }

  function editFolder(f) {
    openModal('フォルダの編集', (body) => {
      nameForm(body, f.name, '名前を保存', (name) => {
        f.name = name;
        saveFolders();
        closeModal();
        render();
      });
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = 'このフォルダを削除';
      del.onclick = () => {
        if (!confirm(`「${f.name}」を削除しますか？\n中のメモは消えずに「すべて」に残ります。`)) return;
        const ks = [];
        for (const [k, arr] of Object.entries(data)) {
          for (const it of arr) if (it.f === f.id) { delete it.f; ks.push(k); }
        }
        folders = folders.filter((x) => x.id !== f.id);
        saveFolders();
        save(...ks);
        closeModal();
        folder = null;
        openAtEnd();
      };
      body.appendChild(del);
    });
  }

  // メモをフォルダに入れる・出す
  function pickFolder(v) {
    const { it, k } = v;
    const assign = (fid) => {
      if (fid) it.f = fid; else delete it.f;
      save(k);
      closeModal();
      // 空行に先にフォルダを決めた場合は、そのまま書けるようにする
      render(it.text === '' || !folder ? it.id : undefined);
    };
    openModal('フォルダに入れる', (body) => {
      if (it.text) {
        const p = document.createElement('p');
        p.className = 'note';
        p.textContent = it.text.length > 40 ? it.text.slice(0, 40) + '…' : it.text;
        body.appendChild(p);
      }
      const list = document.createElement('div');
      list.className = 'choices';
      for (const f of sortedFolders()) {
        const b = document.createElement('button');
        b.textContent = (it.f === f.id ? '✓ ' : '') + '📁 ' + f.name;
        if (it.f === f.id) b.className = 'chosen';
        b.onclick = () => assign(f.id);
        list.appendChild(b);
      }
      if (it.f) {
        const none = document.createElement('button');
        none.textContent = 'フォルダから出す';
        none.onclick = () => assign(null);
        list.appendChild(none);
      }
      const plus = document.createElement('button');
      plus.className = 'link';
      plus.textContent = '＋ 新しいフォルダを作って入れる';
      plus.onclick = () => openModal('新しいフォルダ', (b2) => nameForm(b2, '', '作成して入れる', (name) => {
        assign(createFolder(name).id);
      }));
      body.append(list, plus);
    });
  }

  // ---- コピー ----
  function textFor(arr) {
    return arr.filter((it) => it.text.trim() !== '')
      .map((it) => (it.done ? '✓ ' : '・') + it.text)
      .join('\n');
  }

  function viewText() {
    const lines = [folder ? '📁 ' + folderOf(folder).name : monthLabel(current)];
    let lastDay = null;
    let lastMonth = null;
    for (const { it, k } of view) {
      if (it.text.trim() === '') continue;
      if (folder && k !== lastMonth) { lastMonth = k; lastDay = null; lines.push('', `【${monthLabel(k)}】`); }
      const dk = dayKey(it.t);
      if (dk !== lastDay) { lastDay = dk; lines.push('', `■ ${dayLabel(it.t)}`); }
      lines.push((it.done ? '✓ ' : '・') + it.text);
    }
    return lines.length > 1 ? lines.join('\n') : '';
  }

  async function copy(text, msg) {
    if (!text) { toast('コピーするメモがありません'); return; }
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.style.position = 'fixed'; tmp.style.opacity = '0';
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); } catch (err) {}
      tmp.remove();
    }
    toast(msg);
  }

  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function shiftMonth(delta) {
    const [y, m] = current.split('-').map(Number);
    current = monthKey(new Date(y, m - 1 + delta, 1));
    render();
    window.scrollTo(0, 0);
  }

  $('prev').onclick = () => shiftMonth(-1);
  $('next').onclick = () => shiftMonth(1);
  $('month').onclick = () => {
    if (folder) { editFolder(folderOf(folder)); return; }
    current = thisMonth();
    openAtEnd();
  };
  $('copyAll').onclick = () => {
    const name = folder ? `「${folderOf(folder).name}」` : `${Number(current.split('-')[1])}月`;
    copy(viewText(), `${name}のメモをコピーしました`);
  };

  // 他の端末の変更を反映したあと、入力中の行とカーソル位置はなるべく保って描き直す
  function rerender() {
    const a = document.activeElement;
    if (a && a.tagName === 'TEXTAREA' && listEl.contains(a)) {
      const id = a.dataset.id;
      const has = Object.values(data).some((arr) => arr.some((it) => it.id === id));
      if (!has && a.value === '') {
        const k = folder ? thisMonth() : current;
        month(k).push(withFolder({ id, text: '', done: false, t: newTime() }, folder));
      }
      render(id, a.selectionStart);
    } else if (!modal.hidden) {
      pendingRender = true;
    } else {
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
  }

  // 同期（sync.js）から使う窓口
  window.memoApp = {
    onChange: null,
    onFoldersChange: null,
    months() {
      const out = {};
      for (const k of Object.keys(data)) out[k] = cleanMonth(data[k]);
      return out;
    },
    setMonth(k, arr) {
      data[k] = arr.map((it) => ({ ...it }));
      persistLocal();
      if (folder || k === current) rerender();
    },
    folders: () => folders.map((f) => ({ ...f })),
    setFolders(list) {
      folders = list.map((f) => ({ ...f }));
      try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders)); } catch (e) {}
      rerender();
    },
  };

  // 開いたら一番下の入力行にカーソル
  function openAtEnd() {
    view = buildView();
    render(view[view.length - 1].it.id);
  }
  openAtEnd();
})();
</script>
<script type="module" src="sync.js"></script>
</body>
</html>
